# CI FINET: pe fiecare PR și pe main — lint, type-check, teste (cu PostgreSQL), build,
# scanarea secretelor din fișierele de client și audit de dependențe.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Citește versiunea majoră PostgreSQL din ops/postgres/VERSION. Serviciile unui job pornesc
  # înaintea pașilor, deci versiunea trebuie aflată într-un job separat.
  pg-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      major: ${{ steps.read.outputs.major }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ops/postgres/VERSION
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: read
        run: |
          major="$(tr -d '[:space:]' < ops/postgres/VERSION)"
          if ! printf '%s' "$major" | grep -Eq '^[0-9]+$'; then
            echo "ops/postgres/VERSION invalid: '$major'" >&2
            exit 1
          fi
          echo "major=$major" >> "$GITHUB_OUTPUT"

  ci:
    needs: pg-version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:${{ needs.pg-version.outputs.major }}-alpine
        env:
          POSTGRES_USER: finet
          POSTGRES_PASSWORD: finet_ci
          POSTGRES_DB: finet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finet -d finet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Bază temporară, doar pentru CI; nu e un secret.
      DATABASE_URL: postgres://finet:finet_ci@localhost:5432/finet_test
      APP_MODE: personal
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # pnpm vine prin corepack-ul din Node 24 instalat mai sus (versiunea din `packageManager`).
      - name: Activează pnpm (corepack)
        run: corepack enable

      - name: Instalează dependențele
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatare
        run: pnpm format:check

      # docs/openapi.json trebuie să fie generat din registrul src/openapi/ (pnpm openapi:generate).
      - name: OpenAPI la zi
        run: pnpm openapi:check

      - name: Type-check
        run: pnpm typecheck

      # Rolurile ca în ops/supabase/roles.sql (finet_migrator, finet_app NOBYPASSRLS), pe
      # Postgres-ul de test; psql din containerul serviciului (aceeași versiune).
      - name: Bootstrap roluri FINET (Postgres de test)
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -U finet -d finet_test -v ON_ERROR_STOP=1 -q
          < ops/postgres/test-bootstrap.sql

      - name: Împachetează uneltele (runner-ul de migrații)
        run: pnpm build:tools

      # Runner-ul real, ca rolul `migrate` (finet_migrator), de la zero și apoi a doua oară
      # (idempotent: a doua rulare nu trebuie să aplice nimic).
      - name: Migrații (de două ori)
        env:
          FINET_ROLE: migrate
          # Rolul `migrate` refuză URL-ul altui rol; DATABASE_URL din job se golește aici.
          DATABASE_URL: ""
          # Parolă fictivă din ops/postgres/test-bootstrap.sql (doar pentru CI).
          MIGRATOR_DATABASE_URL: postgres://finet_migrator:finet_migrator_ci@localhost:5432/finet_test
        run: |
          set -o pipefail
          node dist/tools/migrate.mjs
          node dist/tools/migrate.mjs | tee migrate-2.log
          grep -q "aplicate acum 0" migrate-2.log

      # Testele de integrare își creează propriile baze (src/db/testing.ts) cu aceleași roluri.
      - name: Teste
        run: pnpm test

      - name: Teste scripturi ops (fără rețea)
        run: pnpm test:ops

      - name: Build
        run: pnpm build

      - name: Scanează secretele din fișierele de client
        run: pnpm scan:client-secrets

      # Faza 4 (ADR 0010): First Load JS gzip per rută ≤ pragurile din docs/PERFORMANCE.md.
      - name: Buget de mărime JavaScript
        run: pnpm check:bundle --json bundle-size.json

      - name: Raport mărime JavaScript
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bundle-size
          path: bundle-size.json
          if-no-files-found: ignore

      # Non-blocant la început (avertismentele tranzitive pot fi zgomot); se face blocant
      # după ce lista e curată.
      - name: Audit dependențe (producție)
        continue-on-error: true
        run: pnpm audit --prod

  # Backup + restaurare testată (F3-D, docs/BACKUP.md): imaginea de backup REALĂ (construită aici,
  # pe runner, nu pe host), scripturile ei (backup.sh, restore.sh) pe un PostgreSQL efemer cu
  # rolurile de producție (finet_migrator, finet_app NOBYPASSRLS, finet_backup BYPASSRLS):
  # backup → drop schema → restore → amprenta identică, plus negativele (dump ca migrator/app,
  # parole greșite) și retenția 7/4/12. La final, runner-ul de migrații pe baza restaurată
  # trebuie să găsească „aplicate acum 0”.
  backup-restore:
    needs: pg-version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:${{ needs.pg-version.outputs.major }}-alpine
        env:
          POSTGRES_USER: finet
          POSTGRES_PASSWORD: finet_ci
          POSTGRES_DB: finet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finet -d finet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: shellcheck (ops/backup)
        run: |
          command -v shellcheck > /dev/null || sudo apt-get install -y shellcheck
          shellcheck --version
          shellcheck -s sh -x ops/backup/*.sh

      - name: Construiește imaginea de backup
        run: docker build -f ops/backup/Dockerfile --target backup -t finet-backup:ci .

      # Parole FICTIVE (Postgres-ul serviciului, doar pentru job). Limita de memorie a
      # serviciului compose (256m) se aplică și aici.
      - name: Backup și restaurare (restore-test.sh în imaginea de backup)
        run: >-
          docker run --rm --network host --memory=256m --memory-swap=256m
          -e FINET_RESTORE_TEST=1 -e PGHOST=localhost -e PGPORT=5432
          -e PGUSER=finet -e PGPASSWORD=finet_ci
          -e FINET_BACKUP_BIN_DIR=/opt/finet-backup
          -v "$PWD:/work:ro" --entrypoint sh finet-backup:ci /work/ops/backup/restore-test.sh

      # Aceeași procedură prin destinația rclone (decizia operatorului: Google Drive), cu un remote
      # rclone `local` (fără rețea): restic → `rclone serve restic --stdio`, limita overlay-ului.
      - name: Backup și restaurare prin rclone (remote local)
        run: >-
          docker run --rm --network host --memory=384m --memory-swap=384m
          -e FINET_RESTORE_TEST=1 -e FINET_TEST_BACKEND=rclone -e PGHOST=localhost -e PGPORT=5432
          -e PGUSER=finet -e PGPASSWORD=finet_ci
          -e FINET_BACKUP_BIN_DIR=/opt/finet-backup
          -v "$PWD:/work:ro" --entrypoint sh finet-backup:ci /work/ops/backup/restore-test.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Activează pnpm (corepack)
        run: corepack enable

      - name: Instalează dependențele
        run: pnpm install --frozen-lockfile

      - name: Împachetează uneltele (runner-ul de migrații)
        run: pnpm build:tools

      - name: Migrații pe baza restaurată (aplicate acum 0)
        env:
          FINET_ROLE: migrate
          APP_MODE: personal
          DATABASE_URL: ""
          MIGRATOR_DATABASE_URL: postgres://finet_migrator:finet_migrator_ci@localhost:5432/finet_restore_test
        run: |
          set -o pipefail
          node dist/tools/migrate.mjs | tee migrate-restored.log
          grep -q "aplicate acum 0" migrate-restored.log

  # E2E Playwright (Faza 1): login, logout, sesiuni, parolă, rate limiting, antete, `next`, în
  # AMBELE moduri (`personal`, apoi `saas`, secvențial: două `next dev` în același director s-ar
  # bloca), plus proiectul `access` pe serverul de producție. Serverul de dezvoltare rulează cu
  # Access dezactivat DOAR pentru test (config.ts refuză asta în producție).
  e2e:
    needs: pg-version
    runs-on: ubuntu-latest
    timeout-minutes: 55

    services:
      postgres:
        image: postgres:${{ needs.pg-version.outputs.major }}-alpine
        env:
          POSTGRES_USER: finet
          POSTGRES_PASSWORD: finet_ci
          POSTGRES_DB: finet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finet -d finet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Aplicația ca `finet_app` (NOBYPASSRLS); parole fictive din ops/postgres/test-bootstrap.sql.
      DATABASE_URL: postgres://finet_app:finet_app_ci@localhost:5432/finet_test
      APP_MODE: personal
      NEXT_TELEMETRY_DISABLED: "1"
      # Parola utilizatorilor E2E, doar pentru baza temporară a job-ului (nu e un secret real).
      E2E_PASSWORD: e2e-parola-de-test-ci-1
      # Faza 6: storage-ul comun al serverului de dezvoltare și al workerului (proiectul `receipts`).
      STORAGE_DIR: .data/e2e-storage

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Activează pnpm (corepack)
        run: corepack enable

      - name: Instalează dependențele
        run: pnpm install --frozen-lockfile

      - name: Bootstrap roluri FINET (Postgres de test)
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -U finet -d finet_test -v ON_ERROR_STOP=1 -q
          < ops/postgres/test-bootstrap.sql

      - name: Împachetează uneltele (migrații, CLI admin)
        run: pnpm build:tools

      - name: Migrații
        env:
          FINET_ROLE: migrate
          DATABASE_URL: ""
          MIGRATOR_DATABASE_URL: postgres://finet_migrator:finet_migrator_ci@localhost:5432/finet_test
        run: node dist/tools/migrate.mjs

      # Câte treisprezece utilizatori pentru fiecare mod (e2e/fixtures.ts: `auth`, `ledger`, `planning`, `regressions`, `recurring`, `receipts`); parola din
      # stdin, niciodată ca argument.
      - name: Utilizatorii E2E (CLI admin)
        env:
          FINET_ROLE: admin
        run: |
          set -eu
          for mode in personal saas; do
            for kind in main parola sesiuni ledger ledger2 seed planning planning2 regresii recurring recurring2 receipts receipts2; do
              printf '%s\n' "$E2E_PASSWORD" | node dist/tools/admin.mjs create-user \
                --email "e2e-$kind-$mode@finet.test" --name "E2E $kind" --password-stdin
            done
          done

      - name: Build (serverul de producție pentru proiectul `access`)
        run: pnpm build

      - name: Instalează Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      # Faza 6 (ADR 0015): serverul AI FALS (răspunsuri deterministe, numără cererile) și WORKERUL
      # real (pg-boss, preprocesarea, pipeline-ul), în fundal, cu secrete FICTIVE. Niciun furnizor
      # real: AI_ALLOWED_HOSTS permite doar serverul fals de pe loopback.
      - name: Serverul AI fals și workerul (fundal, pentru proiectul `receipts`)
        env:
          FINET_ROLE: worker
          DATABASE_URL: ""
          WORKER_DATABASE_URL: postgres://finet_app:finet_app_ci@localhost:5432/finet_test
          FINET_ALLOW_INSECURE_DB: "1"
          AI_BASE_URL: http://127.0.0.1:4010/v1
          AI_ALLOWED_HOSTS: 127.0.0.1:4010
          AI_API_KEY_FILE: ${{ runner.temp }}/finet-ai-key-fictiv
          AI_MONTHLY_BUDGET: "5.00"
          AI_MONTHLY_BUDGET_CURRENCY: USD
          AI_PRICE_INPUT_PER_MTOK: "0.10"
          AI_PRICE_OUTPUT_PER_MTOK: "0.40"
          AI_RESPONSE_FORMAT: json_object
          AI_DAILY_DOCUMENT_LIMIT: "200"
        run: |
          set -eu
          mkdir -p "$STORAGE_DIR"
          printf 'sk-e2e-fictiv-0000000000000000\n' > "$AI_API_KEY_FILE"
          nohup node e2e/ai-mock-server.mjs > "$RUNNER_TEMP/ai-mock.log" 2>&1 &
          nohup node dist/tools/worker.mjs > "$RUNNER_TEMP/worker.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4010/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4010/health
          for i in $(seq 1 60); do
            grep -q '"event":"started"' "$RUNNER_TEMP/worker.log" && break
            sleep 1
          done
          grep -q '"event":"started"' "$RUNNER_TEMP/worker.log" || { cat "$RUNNER_TEMP/worker.log"; exit 1; }

      - name: E2E — modul personal (smoke, auth, ledger, planning, regressions, recurring, receipts, access)
        env:
          E2E_APP_MODE: personal
          E2E_AI_MOCK_URL: http://127.0.0.1:4010
        run: pnpm test:e2e

      - name: E2E — modul saas (smoke, auth, ledger, planning, regressions, recurring)
        env:
          E2E_APP_MODE: saas
          E2E_SERVER: dev
          APP_MODE: saas
        run: pnpm test:e2e --project=smoke --project=auth --project=ledger --project=planning --project=regressions --project=recurring

      - name: Logurile workerului și ale serverului AI fals (la eșec; fără conținut de bonuri)
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP/worker.log" || true
          tail -n 50 "$RUNNER_TEMP/ai-mock.log" || true

      - name: Raport Playwright (la eșec)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
