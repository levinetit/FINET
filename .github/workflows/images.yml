# Construiește imaginile Docker FINET în CI (hostul de producție are prea puțină memorie pentru
# build) și le păstrează ca artefacte de workflow, descărcate de pe host cu ops/deploy/pull-images.sh.
# Imaginile nu conțin secrete (se construiesc dintr-un repository public, fără variabile de mediu).
name: images

on:
  push:
    branches: [main, "phase/**", "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: imagine ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Rezultatele Trivy (SARIF) merg în Security → Code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            target: runner
            file: Dockerfile
          - name: tools
            target: tools
            file: Dockerfile
          # Imaginea de backup (F3-D): restic + clientul PostgreSQL 17, ops/backup/Dockerfile.
          - name: backup
            target: backup
            file: ops/backup/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construiește imaginea (${{ matrix.target }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: finet:${{ matrix.name }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Împachetează imaginea și suma de control
        run: |
          mkdir -p out
          docker save "finet:${{ matrix.name }}-${{ github.sha }}" | gzip -1 > "out/finet-${{ matrix.name }}.tar.gz"
          (cd out && sha256sum "finet-${{ matrix.name }}.tar.gz" > "finet-${{ matrix.name }}.tar.gz.sha256")
          ls -l out

      - name: Publică artefactul (7 zile)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finet-${{ matrix.name }}-${{ github.sha }}
          path: out/
          retention-days: 7
          if-no-files-found: error

      # Scanarea imaginii (Trivy): sistemul de operare + pachetele Node din imagine. NEBLOCANTĂ
      # (exit-code 0): artefactul e deja publicat, iar `pull-images.sh` cere o rulare `success`;
      # o CVE nouă în imaginea de bază nu trebuie să blocheze un deploy de urgență. Rezultatele
      # apar în Security → Code scanning (SARIF) și în jurnalul pasului (tabel CRITICAL/HIGH).
      # Modernizare 2026, pasul A.
      - name: Scanează imaginea (Trivy, tabel CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: finet:${{ matrix.name }}-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Scanează imaginea (Trivy, SARIF)
        id: trivy-sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: finet:${{ matrix.name }}-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          # Baza de date a fost descărcată de pasul anterior.
          skip-setup-trivy: true

      - name: Publică SARIF-ul Trivy
        # Doar dacă scanarea a produs fișierul (un build eșuat nu are imagine de scanat).
        if: steps.trivy-sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
