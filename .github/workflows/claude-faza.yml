# Rulează agentul Claude Code pe o fază FINET.
#
# Pornire: un issue creat din șablonul „Fază FINET” primește eticheta `faza`,
# iar agentul lucrează pe un branch `phase/...` și deschide un PR.
# Corecturi: un comentariu care începe cu `@claude` în issue sau în PR.
#
# Doar utilizatorii cu drept de scriere pot porni agentul (verificat de action).
# Ghid: docs/GHID_CONSTRUIRE.md, secțiunea 8.4.

name: claude-faza

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# O singură fază odată; o rulare nouă așteaptă terminarea celei curente.
concurrency:
  group: claude-faza
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Pornește doar pentru eticheta `faza` sau pentru comentarii care încep cu @claude.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'faza') ||
      (github.event_name != 'issues' && startsWith(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 180

    services:
      postgres:
        # Aceeași versiune majoră ca proiectul Supabase (variabila POSTGRES_MAJOR).
        image: postgres:${{ vars.POSTGRES_MAJOR || 'latest' }}
        env:
          POSTGRES_USER: finet
          POSTGRES_PASSWORD: finet_ci
          POSTGRES_DB: finet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://finet:finet_ci@localhost:5432/finet_test
      # Fără MIGRATOR_/WORKER_DATABASE_URL la nivel de job: serverul web (rolul implicit) nu
      # pornește dacă le vede. Migrațiile le primesc explicit, pe comanda care le rulează.
      APP_MODE: personal

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Activează pnpm
        run: corepack enable

      - uses: anthropics/claude-code-action@v1
        with:
          # Una dintre cele două: abonamentul Claude (token din `claude setup-token`) sau cheia API.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: faza
          trigger_phrase: "@claude"
          branch_prefix: "phase/"
          use_sticky_comment: true
          # Repository public: doar comentariile proprietarului ajung la agent.
          include_comments_by_actor: ${{ github.repository_owner }}
          claude_args: >-
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns ${{ vars.CLAUDE_MAX_TURNS || '300' }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pnpm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(psql:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*)"
