# Scanare de secrete în istoricul git și în fiecare PR (gitleaks). Completează scanerul propriu
# din CI (`pnpm scan:client-secrets`, doar fișierele de client după build) și „secret scanning”
# al GitHub. Modernizare 2026, pasul A (audit §3). Regulile proprii: `.gitleaks.toml`.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tot istoricul: un secret comis și apoi șters rămâne în git.
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Doar pentru organizații; pe un cont personal nu e necesară.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_SUMMARY: "true"
