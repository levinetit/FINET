# CI FINET Android (Faza A; promptul Android §12): format, analiză statică, teste și APK de debug.
# Nu publică nimic: build-urile de debug din PR-uri rămân artefacte de CI, nu merg în Releases.
# Workflow-ul de release semnat (`android-release.yml`) vine în Faza E.
name: android

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versiunea Flutter fixată (canal stable); aceeași în `mobile/README.md`.
  FLUTTER_VERSION: "3.47.9"

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Versiuni
        run: |
          flutter --version
          java -version

      - name: Dependențe
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analiză statică
        run: flutter analyze

      - name: Teste
        # Un test blocat nu trebuie să țină runner-ul 40 de minute.
        timeout-minutes: 10
        run: flutter test

      # `API_BASE_URL` din CI e o adresă rezervată (`.invalid`), nu un server real: APK-ul de debug
      # din CI nu se conectează nicăieri. Valorile `--dart-define` nu sunt secrete (se pot extrage
      # din APK), iar în CI nu există nicio cheie.
      - name: APK de debug
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://finet.invalid

      - name: Verifică APK-ul (identificator, versiune minimă, mărime)
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          size=$(stat -c %s "$apk")
          echo "Mărime: $size octeți"
          test "$size" -gt 5000000
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          # Fișier întreg (fără `| head`, care poate tăia ieșirea): verificările negative depind de el.
          "$aapt2" dump badging "$apk" > badging.txt
          head -5 badging.txt
          grep -q "package: name='ro.finet.app'" badging.txt
          grep -q "^minSdkVersion:'29'" badging.txt
          grep -q "uses-permission: name='android.permission.INTERNET'" badging.txt
          # Camera prin intentul sistemului: nicio permisiune de cameră sau de stocare în APK.
          # `! grep` nu oprește scriptul sub `set -e`, de aceea `if` explicit.
          if grep -E "uses-permission(-sdk-23)?: name='android\.permission\.(CAMERA|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA[^']*)'" badging.txt; then
            echo "Permisiune interzisă în APK" >&2
            exit 1
          fi
          # „Partajează" din alte aplicații: filtrele de intent trebuie să existe în APK-ul construit
          # (singura dovadă automată că FINET apare în meniul Android de partajare).
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          for needle in \
            'android.intent.action.SEND"' \
            'android.intent.action.SEND_MULTIPLE"' \
            '"image/*"' \
            '"application/pdf"' \
            '"text/csv"'; do
            if ! grep -qF "$needle" manifest.txt; then
              echo "Lipsește din manifest: $needle" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v5
        with:
          name: finet-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
