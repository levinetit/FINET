# CI FINET Android (Faza A; promptul Android §12): format, analiză statică, teste și APK de debug.
# Nu publică nimic: build-urile de debug din PR-uri rămân artefacte de CI, nu merg în Releases.
# Workflow-ul de release semnat (`android-release.yml`) vine în Faza E.
name: android

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
      - ".github/scripts/verify-android-apk.sh"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
      - ".github/scripts/verify-android-apk.sh"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versiunea Flutter fixată (canal stable); aceeași în `mobile/README.md`.
  FLUTTER_VERSION: "3.47.9"

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Versiuni
        run: |
          flutter --version
          java -version

      - name: Dependențe
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analiză statică
        run: flutter analyze

      - name: Teste
        # Un test blocat nu trebuie să țină runner-ul 40 de minute.
        timeout-minutes: 10
        run: flutter test

      # `API_BASE_URL` din CI e o adresă rezervată (`.invalid`), nu un server real: APK-ul de debug
      # din CI nu se conectează nicăieri. Valorile `--dart-define` nu sunt secrete (se pot extrage
      # din APK), iar în CI nu există nicio cheie.
      - name: APK de debug
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://finet.invalid

      - name: Verifică APK-ul de debug
        run: ../.github/scripts/verify-android-apk.sh build/app/outputs/flutter-apk/app-debug.apk debug

      # Build-ul release nu are voie să existe fără cheie: fără semnare trebuie să EȘUEZE.
      - name: Release fără cheie trebuie să eșueze
        run: |
          if flutter build apk --release --dart-define=API_BASE_URL=https://finet.invalid > release-nokey.log 2>&1; then
            echo "Build-ul release a reușit fără cheie de semnare" >&2
            exit 1
          fi
          if ! grep -q "Semnarea release nu e pregătită" release-nokey.log; then
            tail -30 release-nokey.log >&2
            echo "Eșec din alt motiv decât lipsa cheii" >&2
            exit 1
          fi

      # Cu o cheie TEMPORARĂ (generată aici, aruncată la sfârșit) se dovedește că configurația
      # release se construiește, se semnează și trece verificările. Cheia reală nu există în PR-uri.
      - name: APK release cu cheie temporară
        env:
          FINET_KEYSTORE_PATH: ${{ runner.temp }}/ci-temp.jks
          FINET_KEY_ALIAS: ci-temp
        run: |
          pass=$(openssl rand -hex 16)
          echo "::add-mask::$pass"
          keytool -genkeypair -keystore "$FINET_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$pass" -keypass "$pass" -alias "$FINET_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=FINET CI temporar" > /dev/null
          export FINET_KEYSTORE_PASSWORD="$pass" FINET_KEY_PASSWORD="$pass"
          flutter build apk --release --build-name=0.0.0 --build-number=1 \
            --dart-define=API_BASE_URL=https://finet.invalid
          ../.github/scripts/verify-android-apk.sh build/app/outputs/flutter-apk/app-release.apk release - 0.0.0 1

      - uses: actions/upload-artifact@v5
        with:
          name: finet-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
