# FINET pe VPS-ul docker-apps (ADR 0002): servicii din aceeași imagine, pe rețeaua externă
# `apps`, FĂRĂ porturi publicate pe host. Intrarea vine prin cloudflare-tunnel (recomandat) sau
# prin traefik-main (label-urile de mai jos, oprite implicit). Detalii: docs/INFRA.md.
#
# Rulare (doar operatorul, din checkout-ul repo-ului):
#   docker compose -f ops/docker/docker-compose.yml \
#     --env-file /srv/finet/compose/compose.env config     # verificare
#   docker compose -f ops/docker/docker-compose.yml \
#     --env-file /srv/finet/compose/compose.env up -d --build finet-web
#
# Date și secrete în /srv/finet/, NU sub /home: backup-ul hostului face `rclone sync /home`
# pe Google Drive (inclusiv o copie NECRIPTATĂ), fără excluderi pentru FINET (docs/INFRA.md,
# „Date în afara /home”).
#
# Configurația, în trei feluri de fișiere:
#   - `--env-file .../compose.env` (model: ops/docker/compose.env.example): variabilele de
#     INTERPOLARE din acest fișier (${FINET_*}); nu ajung în containere și nu conțin secrete.
#   - SECRETELE, ca fișiere (`secrets:` mai jos), din ${FINET_SECRETS_DIR} (implicit
#     /srv/finet/secrets): câte un fișier pe secret, deținut de uid 1000, mod 400. Docker le
#     montează read-only în /run/secrets/<nume>, iar aplicația le citește prin variabilele
#     `*_FILE` (src/lib/secret-files.ts). Constatarea N1: valorile din `environment`/`env_file`
#     ajung în /home/docker/containers/<id>/config.v2.json (deci în arhiva săptămânală
#     NECRIPTATĂ a /home/docker); fișierele montate ca secrete nu ajung acolo, doar calea lor.
#     Fiecare serviciu primește DOAR secretele rolului său (FINET_ROLE, src/lib/config.ts):
#       finet-web     → finet_database_url, finet_health_token
#       finet-worker  → finet_worker_database_url
#       finet-migrate → finet_migrate_database_url
#     Rolul web refuză să pornească dacă vede URL-ul (sau `_FILE`-ul) workerului ori al
#     migratorului.
#   - `env_file`, câte unul PE SERVICIU, din ${FINET_ENV_DIR}: doar variabile NESECRETE
#     (APP_URL, CF_ACCESS_*, limite). Modele: ops/docker/finet*.env.example.
# `environment:` are prioritate peste `env_file`; acolo stau valorile fixe ale deploy-ului și
# căile `*_FILE`. Niciun secret în `environment` (verificat de ops/docker/test-env-examples.sh).
#
# CA-ul bazei (Supabase, public): ${FINET_CA_DIR} (implicit /srv/finet/ca) montat read-only în
# /run/finet/ca; DATABASE_CA_FILE indică fișierul, iar URL-urile trebuie să aibă
# `sslmode=verify-full` (config.ts refuză CA-ul altfel). Vezi docs/INFRA.md.

name: finet

# Secretele, ca fișiere pe host (create de operator, docs/INFRA.md pasul 4). În modul fără
# swarm, compose le montează ca bind read-only și păstrează proprietarul și modul fișierului
# de pe host (verificat cu sintaxa scurtă; după documentația Compose, uid/gid/mode din
# sintaxa lungă nu se aplică fără swarm, neverificat), deci fișierele trebuie să fie
# `1000:1000 0400` (uid 1000 = utilizatorul `node` din imagine).
secrets:
  finet_database_url:
    file: ${FINET_SECRETS_DIR:-/srv/finet/secrets}/finet_database_url
  finet_health_token:
    file: ${FINET_SECRETS_DIR:-/srv/finet/secrets}/finet_health_token
  finet_worker_database_url:
    file: ${FINET_SECRETS_DIR:-/srv/finet/secrets}/finet_worker_database_url
  finet_migrate_database_url:
    file: ${FINET_SECRETS_DIR:-/srv/finet/secrets}/finet_migrate_database_url

x-ca-volume: &ca-volume
  # CA-ul Supabase (prod-ca-2021.crt din panoul Supabase), read-only. Directorul trebuie să
  # existe (create_host_path: false), altfel pornirea eșuează.
  type: bind
  source: ${FINET_CA_DIR:-/srv/finet/ca}
  target: /run/finet/ca
  read_only: true
  bind:
    create_host_path: false

x-common: &common
  image: ${FINET_IMAGE:-finet:local}
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  finet-web:
    <<: *common
    container_name: finet-web
    hostname: finet-web
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - path: ${FINET_ENV_DIR:-/srv/finet/env}/finet.env
        required: true
    secrets:
      - finet_database_url
      # Decizia mea: tokenul de sănătate e obligatoriu în deploy (fișierul trebuie să existe și
      # să nu fie gol), ca monitorizarea internă să nu depindă de JWT-ul Access.
      - finet_health_token
    environment:
      FINET_ROLE: web
      DATABASE_URL_FILE: /run/secrets/finet_database_url
      HEALTH_TOKEN_FILE: /run/secrets/finet_health_token
      DATABASE_CA_FILE: /run/finet/ca/${FINET_DATABASE_CA_NAME:-prod-ca-2021.crt}
      NODE_ENV: production
      APP_MODE: personal
      # Access e obligatoriu în producție (src/lib/config.ts refuză `false`).
      # CF_ACCESS_TEAM_DOMAIN și CF_ACCESS_AUD vin din env_file.
      CF_ACCESS_REQUIRED: "true"
      # S3 (Supabase Storage) vine în Faza 6; cu `s3` acum, /api/health raportează `degraded`.
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/storage
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - *ca-volume
      # Directorul trebuie creat înainte de operator, deținut de uid 1000 (utilizatorul `node`):
      #   install -d -o 1000 -g 1000 -m 700 /srv/finet/storage
      # `create_host_path: false`: dacă lipsește, pornirea eșuează în loc să creeze un director
      # al lui root, în care aplicația nu poate scrie.
      - type: bind
        source: ${FINET_DATA_DIR:-/srv/finet}/storage
        target: /data/storage
        bind:
          create_host_path: false
    tmpfs:
      # rootfs e read-only; Next.js scrie doar în cache și în /tmp.
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=1000,gid=1000,mode=0700
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      # Liveness local (Host 127.0.0.1, fără antete de proxy); vezi src/lib/access.ts.
      # Ruta /api/health/live NU se publică prin Traefik sau tunel.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      apps:
        # de confirmat de operator: IP liber pe `apps` (verificat liber la 2026-10-27, în afara
        # adreselor ocupate; .2 și intervalul dinamic se evită).
        ipv4_address: ${FINET_WEB_IP:-172.88.88.130}
    labels:
      # Varianta Traefik (oprită implicit: FINET_TRAEFIK_ENABLE=false). Varianta recomandată e
      # cloudflare-tunnel → http://finet-web:3000 (docs/INFRA.md, ops/cloudflare/README.md).
      traefik.enable: "${FINET_TRAEFIK_ENABLE:-false}"
      traefik.docker.network: apps
      # Liveness-ul e exclus explicit din router (apărare în plus față de src/proxy.ts).
      traefik.http.routers.finet.rule: "Host(`${FINET_HOST:?FINET_HOST lipsește (compose.env)}`) && !Path(`/api/health/live`)"
      # `websecure` și `letsencrypt` sunt numele folosite de celelalte servicii de pe host
      # (label-uri observate pe 2026-10-27). Confirmă numele resolverului din traefik.yml.
      traefik.http.routers.finet.entrypoints: websecure
      traefik.http.routers.finet.tls: "true"
      traefik.http.routers.finet.tls.certresolver: "${FINET_CERTRESOLVER:-letsencrypt}"
      traefik.http.services.finet.loadbalancer.server.port: "3000"

  finet-worker:
    <<: *common
    container_name: finet-worker
    hostname: finet-worker
    # Faza 0: workerul e un stub (pg-boss vine în Faza 5/6). Profilul `worker` îl ține oprit
    # implicit, ca să nu consume memorie pe un host încărcat; pornire explicită:
    #   docker compose ... --profile worker up -d finet-worker
    profiles: [worker]
    depends_on:
      finet-web:
        condition: service_healthy
    env_file:
      - path: ${FINET_ENV_DIR:-/srv/finet/env}/finet.worker.env
        required: true
    secrets:
      - finet_worker_database_url
    environment:
      FINET_ROLE: worker
      WORKER_DATABASE_URL_FILE: /run/secrets/finet_worker_database_url
      DATABASE_CA_FILE: /run/finet/ca/${FINET_DATABASE_CA_NAME:-prod-ca-2021.crt}
      NODE_ENV: production
      APP_MODE: personal
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/storage
      NODE_OPTIONS: --max-old-space-size=192
    command:
      - node
      - -e
      - "console.log('finet-worker: inactiv, vine în Faza 6');const t=setInterval(()=>{},3600000);for(const s of ['SIGTERM','SIGINT'])process.on(s,()=>{clearInterval(t);process.exit(0)})"
    volumes:
      - *ca-volume
      - type: bind
        source: ${FINET_DATA_DIR:-/srv/finet}/storage
        target: /data/storage
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128
    # Healthcheck-ul din imagine verifică serverul web; stub-ul nu are HTTP.
    healthcheck:
      disable: true
    networks:
      apps:
        # de confirmat de operator
        ipv4_address: ${FINET_WORKER_IP:-172.88.88.131}

  finet-migrate:
    <<: *common
    container_name: finet-migrate
    hostname: finet-migrate
    # One-shot: rulează migrațiile cu rolul `finet_migrator` și se oprește. Doar el primește
    # secretul finet_migrate_database_url (MIGRATOR_DATABASE_URL_FILE). În Faza 0 nu există migrații (Drizzle vine în Faza 1): comanda e un
    # stub care doar anunță asta. Rulare explicită:
    #   docker compose ... --profile migrate run --rm finet-migrate
    profiles: [migrate]
    restart: "no"
    env_file:
      - path: ${FINET_ENV_DIR:-/srv/finet/env}/finet.migrate.env
        required: true
    secrets:
      - finet_migrate_database_url
    environment:
      FINET_ROLE: migrate
      MIGRATOR_DATABASE_URL_FILE: /run/secrets/finet_migrate_database_url
      DATABASE_CA_FILE: /run/finet/ca/${FINET_DATABASE_CA_NAME:-prod-ca-2021.crt}
      NODE_ENV: production
      APP_MODE: personal
      NODE_OPTIONS: --max-old-space-size=192
    command:
      - node
      - -e
      - "console.log('finet-migrate: nicio migrație în Faza 0 (Drizzle vine în Faza 1)')"
    volumes:
      - *ca-volume
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      disable: true
    # Decizia mea: fără `apps` și fără IP static. Migrarea are nevoie doar de ieșire spre
    # Supabase (rețeaua implicită a proiectului, `finet_default`), nu de celelalte containere,
    # iar un container scurt fără IP fix pe `apps` ar putea ocupa adresa altui serviciu.
    networks:
      - default

networks:
  apps:
    external: true
